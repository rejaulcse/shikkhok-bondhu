<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A3A3D" />
<meta name="mobile-web-app-capable" content="yes" />

      <h1 id="screen-title">শিক্ষক সেবা</h1>

    <div id="hero" class="hero"></div>

    <main>

      <ul id="menu-list" class="menu-list"></ul>

      <div class="credit">
        <img id="credit-photo" class="credit-photo" alt="" />
        <div id="credit-name" class="name"></div>
        <div id="credit-role" class="role"></div>
        <div id="credit-inst" class="inst"></div>
      </div>
    </main>

  <script src="config.js"></script>
